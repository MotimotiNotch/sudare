<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sudare</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="bar">
      <button id="open" class="text">フォルダを開く</button>
      <span id="folder"></span>
      <span id="status"></span>
      <button id="run" class="text" hidden></button>
      <button id="help" class="text" title="画面の場所ごとに、できることを順に見せます">使い方</button>
      <button id="about" class="text">このツールについて</button>
      <div id="progress" hidden></div>
    </header>
    <main id="stage">
      <canvas id="view"></canvas>
      <div id="loading" hidden><span></span></div>
      <p id="empty">フォルダを開くと、直下の JPG の顔を探して、全部にモザイクをかけた状態で並べます。<br />操作は右上の「使い方」から順に見られます。</p>
    </main>
    <aside id="side">
      <div class="row">
        <div id="mode" role="radiogroup" aria-label="矩形のモード">
          <button data-mode="add" role="radio">足す</button>
          <button data-mode="remove" role="radio">外す</button>
        </div>
      </div>
      <label class="row" id="cells-row">
        <span>濃さ</span>
        <input id="cells" type="range" min="4" max="24" step="1" />
      </label>
      <div id="faces"></div>
    </aside>
    <footer id="strip">
      <div id="groups">
        <div id="tabs" role="tablist">
          <button data-tab="faces" role="tab">顔あり <span></span></button>
          <button data-tab="none" role="tab">顔なし <span></span></button>
        </div>
        <div id="pick">
          <button id="pick-all" title="この群の写真を全部チェックする">全選択</button>
          <button id="pick-none" title="この群の写真のチェックを全部外す">全解除</button>
        </div>
      </div>
      <div id="thumbs"></div>
      <button id="export" class="text primary" disabled>書き出す</button>
    </footer>
    <div id="modal" hidden>
      <div class="card" role="dialog" aria-modal="true">
        <h2></h2>
        <p hidden></p>
        <div class="bar"><i></i></div>
        <div class="actions"></div>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
